{% extends "layouts/auth_base.html" %}

{% block title %}
Login | TI Ticket System
{% endblock %}

{% block auth_content %}

<div class="text-center mb-4">

    <h2 class="fw-bold">
        Iniciar Sesión
    </h2>

    <p class="text-muted">
        Accede al sistema de tickets TI
    </p>

</div>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Correo Electrónico
        </label>

        <input
            type="email"
            name="email"
            class="form-control form-control-lg"
            placeholder="correo@empresa.com"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            class="form-control form-control-lg"
            placeholder="********"
            required
        >

    </div>

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div class="form-check">

            <input
                type="checkbox"
                class="form-check-input"
                id="remember"
            >

            <label
                class="form-check-label"
                for="remember"
            >

                Recordarme

            </label>

        </div>

        <a
            href="{{ url_for('auth.forgot_password') }}"
            class="text-decoration-none"
        >

            ¿Olvidó su contraseña?

        </a>

    </div>

    <button
        type="submit"
        class="btn btn-dark btn-lg w-100"
    >

        <i class="bi bi-box-arrow-in-right"></i>
        Ingresar

    </button>

</form>

<div class="text-center mt-4">

    <span class="text-muted">
        ¿No tienes cuenta?
    </span>

    <a
        href="{{ url_for('auth.register') }}"
        class="text-decoration-none fw-semibold"
    >

        Crear cuenta

    </a>

</div>

{% endblock %}
