{% extends "layouts/auth_base.html" %}

{% block title %}
Registro
{% endblock %}

{% block auth_content %}

<div class="card shadow border-0 rounded-4">

    <div class="card-body p-4">

        <div class="text-center mb-4">

            <h3 class="fw-bold">
                Crear Cuenta
            </h3>

            <p class="text-muted">
                Registro de usuarios del sistema
            </p>

        </div>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        class="form-control"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Apellido
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        class="form-control"
                        required
                    >

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Correo
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Confirmar Contraseña
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-dark w-100"
            >

                Crear Cuenta

            </button>

        </form>

        <div class="text-center mt-4">

            <a
                href="{{ url_for('auth.login') }}"
                class="text-decoration-none"
            >

                ¿Ya tienes cuenta? Iniciar sesión

            </a>

        </div>

    </div>

</div>

{% endblock %}
