{% extends "layouts/auth_base.html" %}

{% block title %}
Restablecer Contraseña
{% endblock %}

{% block auth_content %}

<div class="text-center mb-4">

    <h2 class="fw-bold">
        Nueva Contraseña
    </h2>

    <p class="text-muted">
        Ingrese una nueva contraseña segura
    </p>

</div>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Nueva Contraseña
        </label>

        <input
            type="password"
            name="password"
            class="form-control form-control-lg"
            required
        >

    </div>

    <div class="mb-4">

        <label class="form-label">
            Confirmar Contraseña
        </label>

        <input
            type="password"
            name="confirm_password"
            class="form-control form-control-lg"
            required
        >

    </div>

    <button
        type="submit"
        class="btn btn-dark btn-lg w-100"
    >

        <i class="bi bi-shield-lock"></i>
        Actualizar Contraseña

    </button>

</form>

{% endblock %}
