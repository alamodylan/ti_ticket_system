{% extends "layouts/dashboard_base.html" %}

{% block page_title %}
Asignar Ticket
{% endblock %}

{% block dashboard_content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow-sm border-0 rounded-4">

            <div class="card-header bg-white border-0">

                <h4 class="mb-0">
                    Asignar Ticket
                </h4>

            </div>

            <div class="card-body">

                <div class="mb-4">

                    <h5>

                        {{ ticket.ticket_number }}

                    </h5>

                    <p class="text-muted">

                        {{ ticket.title }}

                    </p>

                </div>

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">
                            Seleccionar Técnico
                        </label>

                        <select
                            name="assigned_to_id"
                            class="form-select"
                            required
                        >

                            {% for technician in technicians %}

                            <option value="{{ technician.id }}">

                                {{ technician.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="d-flex justify-content-end gap-2">

                        <a
                            href="{{ url_for('tickets.ticket_detail', ticket_id=ticket.id) }}"
                            class="btn btn-outline-secondary"
                        >

                            Cancelar

                        </a>

                        <button
                            type="submit"
                            class="btn btn-dark"
                        >

                            <i class="bi bi-person-check"></i>
                            Asignar Ticket

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
