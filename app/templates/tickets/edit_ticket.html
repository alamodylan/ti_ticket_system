{% extends "layouts/dashboard_base.html" %}

{% block page_title %}
Editar Ticket
{% endblock %}

{% block dashboard_content %}

<div class="row justify-content-center">

    <div class="col-lg-10">

        <div class="card shadow-sm border-0 rounded-4">

            <div class="card-header bg-white border-0">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <h4 class="mb-1">
                            Editar Ticket
                        </h4>

                        <small class="text-muted">

                            {{ ticket.ticket_number }}

                        </small>

                    </div>

                    <a
                        href="{{ url_for('tickets.ticket_detail', ticket_id=ticket.id) }}"
                        class="btn btn-outline-secondary btn-sm"
                    >
                        Volver
                    </a>

                </div>

            </div>

            <div class="card-body">

                <!-- INFO GENERAL -->

                <div class="row mb-4">

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Sede
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ ticket.site_name }}"
                            readonly
                        >

                    </div>

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Creado por
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ ticket.created_by.full_name if ticket.created_by else 'N/A' }}"
                            readonly
                        >

                    </div>

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Estado Actual
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ ticket.status }}"
                            readonly
                        >

                    </div>

                </div>

                <hr>

                <form method="POST">

                    <div class="row">

                        <!-- TITULO -->

                        <div class="col-md-12 mb-3">

                            <label class="form-label fw-semibold">
                                Título
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ ticket.title }}"
                                required
                            >

                        </div>

                        <!-- DESCRIPCION -->

                        <div class="col-md-12 mb-3">

                            <label class="form-label fw-semibold">
                                Descripción
                            </label>

                            <textarea
                                name="description"
                                rows="6"
                                class="form-control"
                                required
                            >{{ ticket.description }}</textarea>

                        </div>

                        <!-- ESTADO -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold">
                                Estado
                            </label>

                            <select
                                name="status"
                                class="form-select"
                            >

                                {% for item in valid_statuses %}

                                <option
                                    value="{{ item }}"
                                    {% if ticket.status == item %}
                                        selected
                                    {% endif %}
                                >

                                    {{ item }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- PRIORIDAD -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold">
                                Prioridad
                            </label>

                            <select
                                name="priority"
                                class="form-select"
                            >

                                {% for item in valid_priorities %}

                                <option
                                    value="{{ item }}"
                                    {% if ticket.priority == item %}
                                        selected
                                    {% endif %}
                                >

                                    {{ item }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-end gap-2">

                        <a
                            href="{{ url_for('tickets.ticket_detail', ticket_id=ticket.id) }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn btn-dark"
                        >
                            Guardar Cambios
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
