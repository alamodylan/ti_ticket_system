version: '3.9'

services:

  web:
    build: .
    container_name: ti_ticket_system_web
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: ti_ticket_system_db
    restart: always
    environment:
      POSTGRES_DB: ti_ticket_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: